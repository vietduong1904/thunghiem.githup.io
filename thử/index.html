<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thế Giới Hình Học 3D Trực Quan</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            z-index: 100;
            pointer-events: none;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        p {
            margin: 0;
            font-size: 14px;
            color: #a0aec0;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="info">
        <h1>Khám Phá Hình Học 3D</h1>
        <p>Giữ chuột trái và kéo để xoay • Cuộn chuột để phóng to/thu nhỏ</p>
    </div>

    <div id="canvas-container"></div>

    <!-- Nhúng thư viện Three.js và OrbitControls từ CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. Khởi tạo Scene, Camera và Renderer
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // 2. Thêm tương tác xoay bằng chuột (OrbitControls)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 3. Hệ thống Ánh sáng (Giúp vật thể có chiều sâu và chân thực nhất)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const pointLight = new THREE.PointLight(0x00f2fe, 1, 50);
        pointLight.position.set(-5, -3, -5);
        scene.add(pointLight);

        // 4. Tạo vật liệu (Material) có độ bóng và phản chiếu đẹp mắt
        const createMaterial = (colorHex) => {
            return new THREE.MeshPhysicalMaterial({
                color: colorHex,
                metalness: 0.2,
                roughness: 0.2,
                clearcoat: 0.5,
                clearcoatRoughness: 0.1,
                wireframe: false
            });
        };

        // Danh sách các hình khối 3D
        const objects = [];

        // --- HÌNH VUÔNG (Khối Lập Phương) ---
        const cubeGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        const cubeMat = createMaterial(0xff4757); // Đỏ hồng
        const cube = new THREE.Mesh(cubeGeo, cubeMat);
        cube.position.set(-4, 0, 0);
        scene.add(cube);
        objects.push({ mesh: cube, rotSpeed: { x: 0.01, y: 0.01 } });

        // --- HÌNH TAM GIÁC (Khối Chóp Tứ Giác/Tam Giác - Pyramid) ---
        const pyrGeo = new THREE.ConeGeometry(1.2, 2, 4);
        const pyrMat = createMaterial(0x2ed573); // Xanh lá
        const pyramid = new THREE.Mesh(pyrGeo, pyrMat);
        pyramid.position.set(-1.3, 0, 0);
        scene.add(pyramid);
        objects.push({ mesh: pyramid, rotSpeed: { x: 0.005, y: 0.015 } });

        // --- HÌNH CHỮ NHẬT (Khối Hộp Chữ Nhật) ---
        const rectGeo = new THREE.BoxGeometry(2.2, 1.2, 1.2);
        const rectMat = createMaterial(0x1e90ff); // Xanh dương
        const rectBox = new THREE.Mesh(rectGeo, rectMat);
        rectBox.position.set(1.5, 0, 0);
        scene.add(rectBox);
        objects.push({ mesh: rectBox, rotSpeed: { x: 0.01, y: 0.008 } });

        // --- HÌNH LỤC GIÁC (Khối Lăng Trụ Lục Giác) ---
        const hexGeo = new THREE.CylinderGeometry(1, 1, 1.8, 6);
        const hexMat = createMaterial(0xffa502); // Cam
        const hexPrism = new THREE.Mesh(hexGeo, hexMat);
        hexPrism.position.set(4.3, 0, 0);
        scene.add(hexPrism);
        objects.push({ mesh: hexPrism, rotSpeed: { x: 0.008, y: 0.012 } });

        // 5. Xử lý sự kiện khi thay đổi kích thước cửa sổ
        window.addEventListener('resize', onWindowResize, false);

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 6. Vòng lặp Animation (Render và làm cho hình tự xoay nhẹ nhàng)
        function animate() {
            requestAnimationFrame(animate);

            // Cho các hình tự xoay quanh trục để tăng tính trực quan sinh động
            objects.forEach(item => {
                item.mesh.rotation.x += item.rotSpeed.x;
                item.mesh.rotation.y += item.rotSpeed.y;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
